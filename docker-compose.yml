services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONPATH: /app/services/api
      APTURA_API_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        APTURA_BACKEND_URL: http://api:8000
    environment:
      APTURA_BACKEND_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
